<!DOCTYPE html>
<html>
<body>
<h1>Testing Audio</h1>
<audio id="a" preload="auto" crossorigin="anonymous" src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/11/71/d6/1171d6ad-3c96-e027-2af6-58028426588c/mzaf_15137631797407745471.plus.aac.p.m4a"></audio>
<script>
window.testLog = [];
function log(msg) { window.testLog.push(msg); }
const a = document.getElementById('a');
a.addEventListener('loadedmetadata', () => log('METADATA_LOADED duration=' + a.duration));
a.addEventListener('canplay', () => log('CAN_PLAY'));
a.addEventListener('error', (e) => log('ERROR code=' + (a.error ? a.error.code : 'none') + ' msg=' + (a.error ? a.error.message : '')));
a.play().then(() => log('PLAY_RESOLVED')).catch(err => log('PLAY_REJECTED name=' + err.name + ' msg=' + err.message));
</script>
</body>
</html>
