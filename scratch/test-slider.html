<!DOCTYPE html>
<html>
<head>
<style>
.eq-channel {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  width: 50px;
  height: 220px;
}
.eq-slider {
  -webkit-appearance: slider-vertical;
  appearance: slider-vertical;
  writing-mode: vertical-lr;
  direction: rtl;
  width: 30px;
  height: 150px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="eq-channel">
  <span>0dB</span>
  <input type="range" class="eq-slider" min="-12" max="12" value="0" step="0.5" orient="vertical">
  <span>1kHz</span>
</div>
<script>
const s = document.querySelector('.eq-slider');
window.testResults = {
  width: s.offsetWidth,
  height: s.offsetHeight,
  min: s.min,
  max: s.max,
  val: s.value
};
</script>
</body>
</html>
